              desc: "積極投入資安領域論壇，掌握產業合規趨勢，與負責之 ISO 27001 導入經驗相輔相成。負責論壇現場營運與後勤軟硬體機動支援，展現極佳的抗壓性與協調力。",
            },
          ],
          skills: {
            skillsHeading: "專業技能",
            certsHeading: "證照 (依取得時間排序)",
            skillsList: [
              "Power BI",
              "ISO 27001",
              "Photoshop",
              "PowerPoint (簡報製作)",
              "Word (文書處理)",
              "Excel (試算表與數據處理)",
              "Power Automate (程序自動化)",
              "跨部門專案統籌",
              "AI Vibe Coding",
              "社群行銷營運",
            ],
            certsDetailed: [
              {
                title: "銀行內部控制與內部稽核測驗",
                issuer: "財團法人台灣金融研訓院",
                date: "2024年1月",
              },
              {
                title: "信託業務專業測驗",
                issuer: "中華民國信託業商業同業公會",
                date: "2023年8月",
              },
              {
                title: "金融市場常識與職業道德",
                issuer: "中華民國證券暨期貨市場發展基金會",
                date: "2023年8月",
              },
              {
                title: "商業管理能力檢定 第二級",
                issuer: "中華民國商業職業教育學會",
                date: "2021年3月",
              },
              {
                title: "技術士 - 網頁設計",
                issuer: "勞動部",
                date: "2020年7月",
              },
              {
                title: "TQC EXCEL 實用級",
                issuer: "電腦技能基金會",
                date: "2020年6月",
              },
              {
                title: "TQC WORD 實用級",
                issuer: "電腦技能基金會",
                date: "2020年6月",
              },
              {
                title: "技術士 - 電腦軟體應用",
                issuer: "勞動部",
                date: "2019年7月",
              },
              {
                title: "技術士 - 會計事務 (資訊)",
                issuer: "勞動部",
                date: "2019年7月",
              },
              {
                title: "技術士 - 會計事務 (人工記帳)",
                issuer: "勞動部",
                date: "2019年7月",
              },
            ],
          },
          footer: {
            primaryCTA: "平面設計作品集",
            secondaryCTA: "與我聯絡",
          },
        },
      };
 
      // Application State
      let currentLang = "zh";
      let activeTab = "profile";
 
      const tabsConfig = [
        { id: "profile", key: "profile" },
        { id: "experience", key: "experience" },
        { id: "projects", key: "projects" },
        { id: "skills", key: "skills" },
      ];
 
      function formatText(text) {
        // Replace **bold** with <strong> tags
        return text.replace(
          /\*\*(.*?)\*\*/g,
          '<span class="font-semibold text-brand-text">$1</span>'
        );
      }
 
      function updateMetaTags(t) {
        document.title = t.meta.title;
        document.documentElement.lang = currentLang === "en" ? "en" : "zh-TW";
 
        document.querySelector('meta[name="description"]').content =
          t.meta.description;
        document.querySelector('meta[name="keywords"]').content =
          t.meta.keywords;
 
        document.querySelector('meta[property="og:title"]').content =
          t.meta.title;
        document.querySelector('meta[property="og:description"]').content =
          t.meta.description;
 
        document.querySelector('meta[name="twitter:title"]').content =
          t.meta.title;
        document.querySelector('meta[name="twitter:description"]').content =
          t.meta.description;
      }
 
      function renderStaticContent(t) {
        document.getElementById("langBtnText").textContent = t.nav.langBtn;
 
        document.getElementById("heroGreeting").textContent = t.hero.greeting;
        document.getElementById("heroName").textContent = t.hero.name;
        document.getElementById("heroRole").textContent = t.hero.role;
        document.getElementById("heroSummary").textContent = t.hero.summary;
 
        document.getElementById("primaryCTA").textContent = t.footer.primaryCTA;
        document.getElementById("secondaryCTA").textContent =
          t.footer.secondaryCTA;
      }
 
      const tabIcons = {
        profile: "user",
        experience: "briefcase",
        projects: "trophy",
        skills: "award",
      };
 
      function renderTabsHeader(t) {
        const headerContainer = document.getElementById("tabsHeader");
        headerContainer.innerHTML = "";
 
        tabsConfig.forEach((tab) => {
          const isActive = activeTab === tab.id;
          const button = document.createElement("button");
          button.className = `flex items-center gap-2 px-4 md:px-5 py-2.5 text-sm md:text-base font-medium rounded-full whitespace-nowrap transition-all duration-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-accent/40 ${
            isActive
              ? "bg-brand-accent text-white shadow-sm"
              : "text-brand-text/70 hover:text-brand-accent hover:bg-white/60"
          }`;
          button.innerHTML = `<i data-lucide="${
            tabIcons[tab.key]
          }" class="w-4 h-4 shrink-0"></i><span>${t.tabs[tab.key]}</span>`;
 
          button.onclick = () => {
            activeTab = tab.id;
            renderTabsHeader(translations[currentLang]);
            renderTabContent(translations[currentLang]);
          };
 
          headerContainer.appendChild(button);
        });
      }
 
      function getProfileHTML(t) {
        const traitsHTML = t.profile.traits
          .map(
            (trait) =>
              `<span class="px-4 py-2 text-sm rounded-full bg-brand-accent/10 text-brand-accent font-medium border border-brand-accent/20 cursor-default">#${trait}</span>`
          )
          .join("");
 
        const eduHTML = t.profile.education
          .map(
            (edu) =>
              `<div class="relative pl-5 before:content-[''] before:absolute before:left-0 before:top-2 before:w-2 before:h-2 before:bg-brand-accent before:rounded-full">
                    <h5 class="text-brand-text font-medium">${edu.school}</h5>
                    <p class="text-brand-text/70 text-sm mt-1">${edu.degree}</p>
                    <div class="flex items-center space-x-2 mt-2">
                        <span class="text-brand-accent text-xs font-medium bg-brand-sec px-2 py-1 rounded-md">${edu.period}</span>
                    </div>
                </div>`
          )
          .join("");
 
        return `
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12 animate-fade-in">
                <!-- Left Column: Bio & Traits -->
                <div class="lg:col-span-2 space-y-8">
                    <div>
                        <h3 class="text-2xl font-semibold mb-6 flex items-center text-brand-text">
                            <i data-lucide="user" class="w-6 h-6 mr-3 text-brand-accent"></i>
                            ${t.profile.heading}
                        </h3>
                        <p class="leading-relaxed text-lg font-light text-brand-text/90 whitespace-pre-line">${t.profile.autobiography}</p>
                    </div>
                    <div>
                        <h4 class="text-lg font-medium text-brand-text mb-4">${t.profile.traitsHeading}</h4>
                        <div class="flex flex-wrap gap-3">${traitsHTML}</div>
                    </div>
                </div>
 
                <!-- Right Column: Education & Contact -->
                <div class="space-y-8">
                    <div class="bg-brand-bg p-8 rounded-2xl border border-brand-border hover:border-brand-accent/40 hover:shadow-[0_10px_30px_-12px_rgba(120,137,111,0.35)] transition-all duration-300">
                        <h4 class="text-lg font-medium text-brand-text mb-6 flex items-center">
                            <i data-lucide="graduation-cap" class="w-5 h-5 mr-2 text-brand-accent"></i>
                            ${t.profile.eduHeading}
                        </h4>
                        <div class="space-y-6">${eduHTML}</div>
                    </div>
                    <div class="bg-brand-sec p-8 rounded-2xl border border-brand-border/50">
                        <h4 class="text-lg font-medium text-brand-text mb-6">${t.profile.contactInfo}</h4>
                        <div class="space-y-4">
                            <div class="flex items-center space-x-3 text-brand-text/80">
                                <i data-lucide="mail" class="w-5 h-5 text-brand-accent"></i>
                                <a href="mailto:${t.profile.email}" class="hover:text-brand-accent transition-colors">${t.profile.email}</a>
                            </div>
                            <div class="flex items-center space-x-3 text-brand-text/80">
                                <i data-lucide="phone" class="w-5 h-5 text-brand-accent"></i>
                                <span>${t.profile.phone}</span>
                            </div>
                            <div class="flex items-center space-x-3 text-brand-text/80">
                                <i data-lucide="map-pin" class="w-5 h-5 text-brand-accent"></i>
                                <span>${t.profile.location}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
      }
 
      function getExperienceHTML(t) {
        const expsHTML = t.experience
          .map((exp) => {
            const tasksHTML = exp.tasks
              .map(
                (task) =>
                  `<li class="flex items-start group/item">
                        <span class="mr-3 mt-2 flex-shrink-0 flex items-center justify-center">
                            <span class="w-1.5 h-1.5 rounded-full bg-brand-accent/50 group-hover/item:bg-brand-accent group-hover/item:scale-125 transition-all"></span>
                        </span>
                        <span class="text-brand-text/80 font-light leading-relaxed">
                            ${formatText(task)}
                        </span>
                    </li>`
              )
              .join("");
 
            return `
                <div class="group relative flex flex-col md:flex-row gap-6 bg-brand-bg border border-brand-border p-8 rounded-2xl hover:border-brand-accent/50 hover:shadow-[0_14px_36px_-16px_rgba(120,137,111,0.4)] hover:-translate-y-1 transition-all duration-300">
                    <div class="md:w-1/4 shrink-0 pt-1">
                        <div class="flex items-center space-x-2 text-brand-accent font-medium text-sm mb-2">
                            <i data-lucide="calendar" class="w-4 h-4"></i>
                            <span>${exp.period}</span>
                        </div>
                        <h4 class="text-lg font-medium text-brand-text">${exp.company}</h4>
                    </div>
                    <div class="md:w-3/4">
                        <h3 class="text-xl font-semibold text-brand-text mb-4 group-hover:text-brand-accent transition-colors duration-300">${exp.role}</h3>
                        <ul class="space-y-3">${tasksHTML}</ul>
                    </div>
                </div>`;
          })
          .join("");
 
        return `<div class="space-y-8 animate-fade-in">${expsHTML}</div>`;
      }
 
      function getProjectsHTML(t) {
        const projectsHTML = t.projects
          .map(
            (proj) =>
              `<div class="bg-brand-bg border border-brand-border p-8 rounded-2xl hover:border-brand-accent/40 hover:shadow-[0_14px_36px_-16px_rgba(120,137,111,0.4)] hover:-translate-y-1 transition-all duration-300 flex flex-col">
                    <div class="flex items-center space-x-2 text-brand-accent font-medium text-sm mb-4">
                        <i data-lucide="calendar" class="w-4 h-4"></i>
                        <span>${proj.period}</span>
                    </div>
                    <h3 class="text-xl font-semibold text-brand-text mb-4">${proj.title}</h3>
                    <p class="text-brand-text/80 leading-relaxed font-light flex-grow">${proj.desc}</p>
                </div>`
          )
          .join("");
 
        return `<div class="grid grid-cols-1 md:grid-cols-2 gap-8 animate-fade-in">${projectsHTML}</div>`;
      }
 
      function getSkillsHTML(t) {
        const skillsHTML = t.skills.skillsList
          .map(
            (skill) =>
              `<span class="px-4 py-2 text-sm rounded-lg border border-brand-border text-brand-text bg-brand-bg transition-all duration-300 hover:bg-brand-sec hover:border-brand-accent hover:text-brand-accent hover:-translate-y-0.5 cursor-default shadow-sm">${skill}</span>`
          )
          .join("");
 
        const certsHTML = t.skills.certsDetailed
          .map(
            (cert) =>
              `<div class="flex items-start p-4 bg-brand-sec/40 rounded-xl border border-brand-border/60 hover:bg-brand-sec hover:border-brand-accent/50 transition-all duration-300 hover:-translate-y-0.5">
                    <div class="bg-white p-2.5 rounded-lg shadow-sm border border-brand-border/50 mr-4 text-brand-accent shrink-0">
                        <i data-lucide="award" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <h4 class="text-brand-text font-medium text-sm mb-1 leading-tight">${cert.title}</h4>
                        <p class="text-brand-text/60 text-xs">${cert.issuer}</p>
                        <p class="text-brand-accent text-xs font-semibold mt-1.5">${cert.date}</p>
                    </div>
                </div>`
          )
          .join("");
 
        return `
            <div class="space-y-8 animate-fade-in">
                <div class="bg-brand-bg border border-brand-border rounded-2xl p-8 hover:border-brand-accent/40 hover:shadow-[0_10px_30px_-12px_rgba(120,137,111,0.35)] transition-all duration-300">
                    <div class="flex items-center space-x-3 text-brand-accent mb-6">
                        <i data-lucide="briefcase" class="w-5 h-5"></i>
                        <h3 class="text-lg font-medium text-brand-text">${t.skills.skillsHeading}</h3>
                    </div>
                    <div class="flex flex-wrap gap-3">${skillsHTML}</div>
                </div>
 
                <div class="bg-brand-bg border border-brand-border rounded-2xl p-8 hover:border-brand-accent/40 hover:shadow-[0_10px_30px_-12px_rgba(120,137,111,0.35)] transition-all duration-300">
                    <div class="flex items-center space-x-3 text-brand-accent mb-6">
                        <i data-lucide="award" class="w-5 h-5"></i>
                        <h3 class="text-lg font-medium text-brand-text">${t.skills.certsHeading}</h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${certsHTML}
                    </div>
                </div>
            </div>`;
      }
 
      function renderTabContent(t) {
        const container = document.getElementById("tabContentContainer");
        let html = "";
 
        if (activeTab === "profile") html = getProfileHTML(t);
        else if (activeTab === "experience") html = getExperienceHTML(t);
        else if (activeTab === "projects") html = getProjectsHTML(t);
        else if (activeTab === "skills") html = getSkillsHTML(t);
 
        container.innerHTML = html;
        safeCreateIcons(); // Re-initialize icons inside new DOM
      }
 
      function safeCreateIcons() {
        // Guards against "lucide is not defined" if the icon CDN fails to load
        if (typeof lucide !== "undefined" && lucide.createIcons) {
          lucide.createIcons();
        } else {
          console.warn("Lucide icons unavailable: script failed to load.");
        }
      }
 
      function switchLanguage() {
        currentLang = currentLang === "en" ? "zh" : "en";
        const t = translations[currentLang];
 
        updateMetaTags(t);
        renderStaticContent(t);
        renderTabsHeader(t);
        renderTabContent(t);
      }
 
      document
        .getElementById("langToggleBtn")
        .addEventListener("click", switchLanguage);
 
      // Init App
      const initT = translations[currentLang];
      updateMetaTags(initT);
      renderStaticContent(initT);
      renderTabsHeader(initT);
      renderTabContent(initT);
    </script>
  </body>
</html>
